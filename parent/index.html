<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="description" content="家長與學生即時成績查詢" />
<title>家長／學生查詢</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--line:#e3e8ef;--text:#111827;--muted:#6b7280;
  --primary:#2563eb;--primary-soft:#eff6ff;--danger:#dc2626;--success:#2563eb;
  --shadow:0 12px 32px rgba(15,23,42,.08);--radius:22px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,#f8fbff 0%,#f4f7fb 38%,#eef2f7 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.login-shell{width:min(100%,430px)}
.brand{text-align:center;margin-bottom:22px}
.brand .mark{width:54px;height:54px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-size:26px;font-weight:900}
h1{font-size:27px;margin:0 0 8px;letter-spacing:.02em}
.sub{font-size:14px;color:var(--muted);line-height:1.6;margin:0}
.login-card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
label{display:block;font-size:14px;font-weight:800;color:#374151;margin-top:16px}
label:first-of-type{margin-top:0}
input{width:100%;margin-top:7px;border:1px solid #d1d5db;border-radius:13px;background:#fff;padding:14px;font-size:17px;outline:none;transition:.15s}
input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}
input::placeholder{color:#9ca3af}
.hint{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.5}
.login-btn{width:100%;border:0;border-radius:13px;padding:14px 16px;font-size:17px;font-weight:800;margin-top:20px;background:var(--primary);color:#fff}
.login-btn:disabled{opacity:.55;cursor:default}
.status{min-height:24px;margin-top:13px;font-size:14px;line-height:1.6;text-align:center;color:var(--muted)}
.status.error{color:var(--danger)}
.status.success{color:#047857}
.secure{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}

/* app */
#appView{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.app-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,232,240,.9)}
.app-header-inner{max-width:1120px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.app-title{font-weight:900;font-size:18px;letter-spacing:.02em}
.app-sub{font-size:12px;color:var(--muted);margin-top:2px}
.logout-btn{border:1px solid var(--line);background:#fff;color:#4b5563;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700}
.desktop-nav{display:none}
.app-main{max-width:1120px;margin:0 auto;padding:16px 14px 26px}
.student-card{background:linear-gradient(135deg,#eff6ff,#fff 72%);border:1px solid #dbeafe;border-radius:20px;padding:16px;display:flex;align-items:center;gap:13px;box-shadow:0 8px 24px rgba(37,99,235,.06)}
.student-avatar{width:52px;height:52px;border-radius:17px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-size:22px;font-weight:900;flex:none}
.student-name{font-size:19px;font-weight:900;margin-bottom:5px}
.student-meta{font-size:13px;color:#64748b;line-height:1.5}
.section{margin-top:20px}
.section-title{font-size:20px;font-weight:900;display:flex;align-items:center;gap:9px;margin:0 0 12px}
.section-title::before{content:"";width:5px;height:25px;background:var(--primary);border-radius:999px}
.date-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.date-tabs::-webkit-scrollbar{display:none}
.date-tab{flex:0 0 auto;border:1px solid #d8dee8;background:#fff;color:#334155;border-radius:999px;padding:9px 13px;font-size:14px;font-weight:800;white-space:nowrap}
.date-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.empty-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 18px;text-align:center;color:var(--muted);box-shadow:0 6px 20px rgba(15,23,42,.05)}
.grade-area{margin-top:12px}
.grade-counter{text-align:center;color:#475569;font-size:13px;font-weight:800;margin:4px 0 9px}
.grade-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 1px 8px}
.grade-track::-webkit-scrollbar{display:none}
.grade-card{scroll-snap-align:center;flex:0 0 100%;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px;text-align:center;min-height:272px;display:flex;flex-direction:column;justify-content:center}
.grade-heading{font-size:18px;font-weight:900;line-height:1.45}
.grade-score{font-size:66px;line-height:1;font-weight:950;letter-spacing:-.04em;color:#111827;margin:20px 0 18px}
.grade-score small{font-size:21px;font-weight:800;margin-left:5px;letter-spacing:0}
.grade-info{border-top:1px solid var(--line);padding-top:15px;font-size:15px;font-weight:700;line-height:1.7;color:#374151}
.grade-comparison{font-size:17px;font-weight:900;margin-top:13px}
.grade-comparison.above{color:#2563eb}
.grade-comparison.below{color:#dc2626}
.grade-comparison.equal{color:#111827}
.swipe-note{text-align:center;color:#94a3b8;font-size:12px;margin-top:2px}
.placeholder-panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 20px;text-align:center;box-shadow:var(--shadow)}
.placeholder-panel h2{margin:0 0 8px;font-size:21px}
.placeholder-panel p{margin:0;color:var(--muted);line-height:1.7}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr)}
.nav-btn{border:0;background:transparent;color:#6b7280;padding:7px 4px 4px;font-size:12px;font-weight:800;display:grid;gap:3px;place-items:center}
.nav-btn .icon{font-size:21px;line-height:1}
.nav-btn.active{color:var(--primary)}

/* desktop: same functions, different information layout */
@media(min-width:768px){
  .login-card{padding:28px}.login-wrap{padding:40px}.login-shell{width:460px}
  #appView{padding-bottom:34px}
  .app-header-inner{padding:15px 24px}
  .desktop-nav{display:flex;gap:6px;margin-left:auto}
  .desktop-nav .nav-btn{display:flex;grid-template:none;gap:7px;border-radius:10px;padding:8px 12px;font-size:14px}
  .desktop-nav .nav-btn.active{background:var(--primary-soft)}
  .bottom-nav{display:none}
  .app-main{padding:28px 24px 40px}
  .desktop-home-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
  .student-card{position:sticky;top:92px;display:block;padding:24px;text-align:center}
  .student-avatar{width:72px;height:72px;border-radius:22px;margin:0 auto 14px;font-size:29px}
  .student-name{font-size:23px}
  .student-meta{font-size:14px;margin-top:8px}
  .section{margin-top:0}
  .section-title{font-size:24px;margin-bottom:15px}
  .date-tabs{flex-wrap:wrap;overflow:visible;padding-bottom:4px}
  .date-tab{font-size:15px;padding:10px 15px}
  .grade-area{margin-top:16px}
  .grade-counter{text-align:left;margin:2px 0 10px 2px}
  .grade-track{gap:16px;overflow-x:auto}
  .grade-card{flex-basis:min(500px,72%);min-height:300px;padding:26px}
  .grade-heading{font-size:21px}
  .grade-score{font-size:78px}
  .grade-info{font-size:16px}
  .grade-comparison{font-size:19px}
  .swipe-note{text-align:left;margin-left:2px}
}
@media(min-width:1100px){
  .grade-card{flex-basis:48%}
}
</style>
</head>
<body>
<main id="loginView" class="login-wrap">
  <div class="login-shell">
    <div class="brand">
      <div class="mark">成</div>
      <h1>家長／學生查詢</h1>
      <p class="sub">輸入學生資料後，即可查看目前公開學期的成績。</p>
    </div>
    <section class="login-card">
      <form id="loginForm" novalidate>
        <label for="account">學號</label>
        <input id="account" name="account" type="text" inputmode="numeric" autocomplete="username" placeholder="請輸入學號" required />
        <label for="last4">身分證後4碼</label>
        <input id="last4" name="last4" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="請輸入4碼" required />
        <div class="hint">若後4碼開頭為 0，請完整輸入 4 碼。</div>
        <button id="loginBtn" class="login-btn" type="submit">登入查詢</button>
        <div id="status" class="status" aria-live="polite"></div>
        <div class="secure">僅查詢目前公開班級；登入失敗時不會提示是否存在舊學期資料。</div>
      </form>
    </section>
  </div>
</main>

<div id="appView" class="hidden">
  <header class="app-header">
    <div class="app-header-inner">
      <div>
        <div class="app-title">家長／學生查詢</div>
        <div id="headerClass" class="app-sub"></div>
      </div>
      <nav class="desktop-nav" aria-label="主要導覽">
        <button class="nav-btn active" data-page="home"><span class="icon">⌂</span><span>首頁</span></button>
        <button class="nav-btn" data-page="records"><span class="icon">▤</span><span>成績紀錄</span></button>
        <button class="nav-btn" data-page="subjects"><span class="icon">▥</span><span>分科表現</span></button>
      </nav>
      <button id="logoutBtn" class="logout-btn" type="button">登出</button>
    </div>
  </header>

  <main class="app-main">
    <section id="homePage" class="app-page">
      <div class="desktop-home-grid">
        <aside id="studentCard" class="student-card"></aside>
        <div>
          <section class="section">
            <h2 class="section-title">近期成績</h2>
            <div id="dateTabs" class="date-tabs"></div>
            <div id="gradeArea" class="grade-area"></div>
          </section>
        </div>
      </div>
    </section>

    <section id="recordsPage" class="app-page hidden">
      <div class="placeholder-panel"><h2>成績紀錄</h2><p>第 8 步會在這裡建立完整成績紀錄。</p></div>
    </section>
    <section id="subjectsPage" class="app-page hidden">
      <div class="placeholder-panel"><h2>分科表現</h2><p>第 9 步會在這裡建立分科近期成績與平均。</p></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主要導覽">
    <button class="nav-btn active" data-page="home"><span class="icon">⌂</span><span>首頁</span></button>
    <button class="nav-btn" data-page="records"><span class="icon">▤</span><span>成績紀錄</span></button>
    <button class="nav-btn" data-page="subjects"><span class="icon">▥</span><span>分科表現</span></button>
  </nav>
</div>

<script>
(() => {
  const API = 'https://sphrceazgfrjtgeeikfp.supabase.co/functions/v1/parent-query-api';
  const SESSION_KEY = 'class-grade-system-parent-session';
  const pathParts = location.pathname.split('/').filter(Boolean);
  const queryCode = String(pathParts[0] === 'p' ? pathParts[1] : '').trim().toLowerCase();
  let sessionData = null;
  let selectedDate = '';

  const loginView = document.getElementById('loginView');
  const appView = document.getElementById('appView');
  const form = document.getElementById('loginForm');
  const account = document.getElementById('account');
  const last4 = document.getElementById('last4');
  const btn = document.getElementById('loginBtn');
  const status = document.getElementById('status');

  function setStatus(message, type='') {
    status.textContent = message || '';
    status.className = `status${type ? ' ' + type : ''}`;
  }
  function text(v){ return String(v ?? '').trim(); }
  function round2(n){ return Number.isFinite(Number(n)) ? Number(n).toFixed(2) : '—'; }
  function dateValue(s){
    const m = text(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return null;
    return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), 12, 0, 0, 0);
  }
  function dateLabel(s){
    const d = dateValue(s);
    if (!d) return s;
    const week = ['日','一','二','三','四','五','六'][d.getDay()];
    return `${d.getMonth()+1}/${d.getDate()}(${week})`;
  }
  function inLast7CalendarDays(s){
    const d = dateValue(s); if (!d) return false;
    const today = new Date(); today.setHours(12,0,0,0);
    const start = new Date(today); start.setDate(start.getDate()-6);
    return d >= start && d <= today;
  }
  function comparisonText(v){ return v === 'above' ? '高於班平均' : v === 'below' ? '低於班平均' : '等於班平均'; }
  function comparisonClass(v){ return v === 'above' ? 'above' : v === 'below' ? 'below' : 'equal'; }

  function saveSession(data){
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({queryCode,data,savedAt:Date.now()})); } catch(_){}
  }
  function restoreSession(){
    try{
      const raw=sessionStorage.getItem(SESSION_KEY); if(!raw) return null;
      const saved=JSON.parse(raw);
      if(saved?.queryCode!==queryCode || !saved?.data?.ok) return null;
      return saved.data;
    }catch(_){ return null; }
  }

  function renderStudent(data){
    const s=data.student||{}, c=data.class||{};
    const term=c.term ? `第${c.term}學期` : '';
    const meta=[c.name,c.schoolYear?`${c.schoolYear}學年度`:'',term].filter(Boolean).join('｜');
    document.getElementById('headerClass').textContent=meta;
    const initial=(text(s.name).slice(0,1)||'學');
    document.getElementById('studentCard').innerHTML=`
      <div class="student-avatar">${escapeHtml(initial)}</div>
      <div>
        <div class="student-name">${escapeHtml(s.name||'學生')}</div>
        <div class="student-meta">${escapeHtml(meta)}<br>座號 ${escapeHtml(s.seat||'—')}｜學號 ${escapeHtml(s.account||'—')}</div>
      </div>`;
  }

  function escapeHtml(v){
    return text(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }
  function recentDates(records){
    const seen=new Set(), dates=[];
    for(const r of records){
      const d=text(r.date);
      if(!d || seen.has(d) || !inLast7CalendarDays(d)) continue;
      seen.add(d); dates.push(d);
    }
    return dates.sort((a,b)=>b.localeCompare(a));
  }

  function renderDates(records){
    const dates=recentDates(records);
    const tabs=document.getElementById('dateTabs');
    if(!dates.length){ tabs.innerHTML=''; selectedDate=''; return dates; }
    if(!dates.includes(selectedDate)) selectedDate=dates[0];
    tabs.innerHTML=dates.map(d=>`<button type="button" class="date-tab${d===selectedDate?' active':''}" data-date="${escapeHtml(d)}">${escapeHtml(dateLabel(d))}</button>`).join('');
    tabs.querySelectorAll('.date-tab').forEach(el=>el.addEventListener('click',()=>{
      selectedDate=el.dataset.date||'';
      renderDates(records); renderGrades(records);
    }));
    return dates;
  }

  function renderGrades(records){
    const area=document.getElementById('gradeArea');
    if(!selectedDate){ area.innerHTML='<div class="empty-card">最近 7 天沒有成績</div>'; return; }
    const list=records.filter(r=>text(r.date)===selectedDate);
    if(!list.length){ area.innerHTML='<div class="empty-card">沒有成績</div>'; return; }
    area.innerHTML=`
      <div class="grade-counter"><span id="gradeCurrent">1</span> / ${list.length}</div>
      <div id="gradeTrack" class="grade-track">
        ${list.map(r=>`
          <article class="grade-card">
            <div class="grade-heading">${escapeHtml(r.subject)}｜${escapeHtml(r.examName)}</div>
            <div class="grade-score">${r.score==null?'—':escapeHtml(r.score)}${r.score==null?'':'<small>分</small>'}</div>
            <div class="grade-info">班平均 ${round2(r.classAverage)}｜第 ${r.rank??'—'} 名／${r.participantCount??0} 人</div>
            <div class="grade-comparison ${comparisonClass(r.comparison)}">${comparisonText(r.comparison)}</div>
          </article>`).join('')}
      </div>
      ${list.length>1?'<div class="swipe-note">左右滑動查看當日其他成績</div>':''}`;
    const track=document.getElementById('gradeTrack');
    const current=document.getElementById('gradeCurrent');
    if(track&&current&&list.length>1){
      let raf=0;
      track.addEventListener('scroll',()=>{
        cancelAnimationFrame(raf);
        raf=requestAnimationFrame(()=>{
          const first=track.querySelector('.grade-card'); if(!first) return;
          const step=first.getBoundingClientRect().width+12;
          const idx=Math.max(0,Math.min(list.length-1,Math.round(track.scrollLeft/step)));
          current.textContent=String(idx+1);
        });
      },{passive:true});
    }
  }

  function renderHome(data){
    renderStudent(data);
    const records=Array.isArray(data.records)?data.records:[];
    renderDates(records);
    renderGrades(records);
  }

  function openPage(page){
    ['home','records','subjects'].forEach(name=>{
      document.getElementById(`${name}Page`)?.classList.toggle('hidden',name!==page);
    });
    document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function showApp(data){
    sessionData=data; saveSession(data);
    loginView.classList.add('hidden'); appView.classList.remove('hidden');
    renderHome(data); openPage('home');
  }

  document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));
  document.getElementById('logoutBtn').addEventListener('click',()=>{
    try{sessionStorage.removeItem(SESSION_KEY);}catch(_){}
    sessionData=null; selectedDate='';
    appView.classList.add('hidden'); loginView.classList.remove('hidden');
    form.reset(); setStatus('');
  });

  if (!/^[a-z0-9-]{4,32}$/.test(queryCode)) {
    btn.disabled = true;
    setStatus('查詢網址無效，請向老師確認正確網址。', 'error');
    return;
  }

  const restored=restoreSession();
  if(restored){ showApp(restored); }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const studentAccount = account.value.trim();
    const pass = last4.value.trim();
    if (!studentAccount || !/^\d{4}$/.test(pass)) {
      setStatus('請輸入學號與完整的身分證後4碼。', 'error'); return;
    }
    btn.disabled = true; btn.textContent = '查詢中……'; setStatus('正在確認學生資料……');
    try {
      const res = await fetch(API, {
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ queryCode, studentAccount, last4: pass })
      });
      let data = {}; try { data = await res.json(); } catch (_) {}
      if (!res.ok || !data?.ok) {
        if (res.status === 503) throw new Error('查詢服務暫時無法使用，請稍後再試。');
        throw new Error(data?.message || '查無符合的學生資料，請確認學號與身分證後4碼是否正確。');
      }
      setStatus('登入成功。', 'success'); showApp(data);
    } catch (err) {
      setStatus(err?.message || '查詢失敗，請稍後再試。', 'error');
    } finally {
      btn.disabled = false; btn.textContent = '登入查詢';
    }
  });
})();
</script>
</body>
</html>
