<style>

#appView{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}.app-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,232,240,.9)}.app-header-inner{max-width:1120px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.app-title{font-weight:900;font-size:18px;letter-spacing:.02em}.app-sub{font-size:12px;color:var(--muted);margin-top:2px}.logout-btn{border:1px solid var(--line);background:#fff;color:#4b5563;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700}.desktop-nav{display:none}.app-main{max-width:1120px;margin:0 auto;padding:16px 14px 26px}.student-card{background:linear-gradient(135deg,#eff6ff,#fff 72%);border:1px solid #dbeafe;border-radius:20px;padding:16px;display:flex;align-items:center;gap:13px;box-shadow:0 8px 24px rgba(37,99,235,.06)}.student-avatar{width:52px;height:52px;border-radius:17px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-size:22px;font-weight:900;flex:none}.student-name{font-size:19px;font-weight:900;margin-bottom:5px}.student-meta{font-size:13px;color:#64748b;line-height:1.5}.section{margin-top:20px}.section-title{font-size:20px;font-weight:900;display:flex;align-items:center;gap:9px;margin:0 0 12px}.section-title::before{content:"";width:5px;height:25px;background:var(--primary);border-radius:999px}.date-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.date-tabs::-webkit-scrollbar{display:none}.date-tab{flex:0 0 auto;border:1px solid #d8dee8;background:#fff;color:#334155;border-radius:999px;padding:9px 13px;font-size:14px;font-weight:800;white-space:nowrap}.date-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}.empty-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 18px;text-align:center;color:var(--muted);box-shadow:0 6px 2 .subject-controls{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 7px 22px rgba(15,23,42,.05);margin-bottom:14px}.subject-controls label{margin:0}.subject-select{font-size:16px;padding:12px 13px}.recent-choice-label{font-size:13px;font-weight:800;color:#64748b;margin:14px 0 8px}.recent-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.recent-choice button{border:1px solid #d8dee8;background:#fff;color:#475569;border-radius:11px;padding:9px 8px;font-weight:850}.recent-choice button.active{background:var(--primary);color:#fff;border-color:var(--primary)}.subject-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.summary-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(15,23,42,.045)}.summary-label{font-size:12px;color:#64748b;font-weight:800;line-height:1.45}.summary-value{font-size:27px;font-weight:950;margin-top:7px;letter-spacing:-.02em}.subject-section-label{font-size:17px;font-weight:900;margin:0 0 9px}.subject-counter{text-align:center;color:#475569;font-size:13px;font-weight:800;margin:3px 0 9px}.subject-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 1px 8px}.subject-track::-webkit-scrollbar{display:none}.subject-card{scroll-snap-align:center;flex:0 0 100%;background:#fff;border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);padding:19px 17px;min-height:245px;display:flex;flex-direction:column}.subject-card-date{font-size:15px;color:#1d4ed8;font-weight:900}.subject-card-name{font-size:18px;font-weight:900;margin-top:5px;line-height:1.4}.subject-card-score{font-size:49px;font-weight:950;line-height:1;margin:20px 0 15px}.subject-card-score small{font-size:18px;margin-left:4px}.subject-card-detail{border-top:1px solid var(--line);padding-top:13px;font-size:14px;line-height:1.75;color:#475569;font-weight:750}.subject-card .grade-comparison{margin-top:auto;padding-top:9px;font-size:16px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr)}.nav-btn{border:0;background:transparent;color:#6b7280;padding:7px 4px 4px;font-size:12px;font-weight:800;display:grid;gap:3px;place-items:center}.nav-btn .icon{font-size:21px;line-height:1}.nav-btn.active{color:var(--primary)}
@media(min-width:768px){.login-card{padding:28px}.login-wrap{padding:40px}.login-shell{width:460px}#appView{padding-bottom:34px}.app-header-inner{padding:15px 24px}.desktop-nav{display:flex;gap:6px;margin-left:auto}.desktop-nav .nav-btn{display:flex;grid-template:none;gap:7px;border-radius:10px;padding:8px 12px;font-size:14px}.desktop-nav .nav-btn.active{background:var(--primary-soft)}.bottom-nav{display:none}.app-main{padding:28px 24px 40px}.desktop-home-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}.student-card{position:sticky;top:92px;display:block;padding:24px;text-align:center}.student-avatar{width:72px;height:72px;border-radius:22px;margin:0 auto 14px;font-size:29px}.student-name{font-size:23px}.student-meta{font-size:14px;margin-top:8px}.section{margin-top:0}.section-title{font-size:24px;margin-bottom:15px}.date-tabs{flex-wrap:wrap;overflow:visible;padding-bottom:4px}.date-tab{font-size:15px;padding:10px 15px}.grade-area{margin-top:16px}.grade-counter,.grade-area>.swipe-note{display:none}.grade-track{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;overflow:visible;scroll-snap-type:none;padding:2px 1px 8px}.grade-card{min-width:0;min-height:285px;padding:24px;scroll-snap-align:none}.grade-heading{font-size:19px}.grade-score{font-size:68px}.grade-info{font-size:15px}.grade-comparison{font-size:18px}.records-head,.subjects-head{margin-bottom:18px}.records-head h2,.subjects-head h2{font-size:26px}.record-date{padding:14px 20px;font-size:18px}.record-row{padding:15px 20px;grid-template-columns:minmax(0,1fr) 120px 150px;align-items:center;gap:18px}.record-main{font-size:16px}.record-values{display:contents}.record-score{font-size:18px;text-align:right}.record-average{font-size:14px;text-align:right}.load-more{max-width:320px;display:block;margin:8px auto 0}.subject-controls{display:grid;grid-template-columns:minmax(260px,1fr) 300px;gap:24px;align-items:end;padding:18px}.recent-choice-label{margin-top:0}.subject-summary{grid-template-columns:repeat(2,minmax(0,260px));gap:14px}.summary-card{padding:20px}.summary-value{font-size:32px}.subject-counter,.subjects-shell .swipe-note{display:none}.subject-track{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;overflow:visible;scroll-snap-type:none;padding:2px 1px 8px}.subject-card{min-width:0;min-height:270px;padding:21px;scroll-snap-align:none}.subject-card-score{font-size:55px}}
@media(min-width:1100px){.subject-track{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

<body>
<main id="loginView" class="login-wrap"><div class="login-shell"><div class="brand"><div class="mark">成</div><h1>家長／學生查詢</h1></div><section class="login-card"><form id="loginForm" novalidate><label for="account">學號</label><input id="account" name="account" type="text" inputmode="numeric" autocomplete="username" placeholder="請輸入學號" required /><label for="last4">身分證後4碼</label><input id="last4" name="last4" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="請輸入4碼" required /><div class="hint">若後4碼開頭為 0，請完整輸入 4 碼。</div><button id="loginBtn" class="login-btn" type="submit">登入查詢</button><div id="status" class="status" aria-live="polite"></div></form></section></div></main>
<div id="appView" class="hidden"><header class="app-header"><div class="app-header-inner"><div><div class="app-title">家長／學生查詢</div><div id="headerClass" class="app-sub"></div></div><nav class="desktop-nav" aria-label="主要導覽"><button class="nav-btn active" data-page="home"><span class="icon">⌂</span><span>首頁</span></button><button class="nav-btn" data-page="records"><span class="icon">▤</span><span>成績紀錄</span></button><button class="nav-btn" data-page="subjects"><span class="icon">▥</span><span>分科表現</span></button></nav><button id="logoutBtn" class="logout-btn" type="button">登出</button></div></header>
<main class="app-main">
<section id="homePage" class="app-page"><div class="desktop-home-grid"><aside id="studentCard" class="student-card"></aside><div><section class="section"><h2 class="section-title">近期成績</h2><div id="dateTabs" class="date-tabs"></div><div id="gradeArea" class="grade-area"></div></section></div></div></section>
<section id="recordsPage" class="app-page hidden"><div class="records-shell"><div class="records-head"><div><h2>成績紀錄</h2><p>依日期由新到舊，查看目前公開學期的成績。</p></div></div><div id="recordsList"></div><div id="recordsMore"></div></div></section>
<section id="subjectsPage" class="app-page hidden"><div class="subjects-shell"><div class="subjects-head"><div><h2>分科表現</h2><p>依科目查看近期表現與本學期平均。</p></div></div><div id="subjectContent"></div></div></section>
</main>
<nav class="bottom-nav" aria-label="主要導覽"><button class="nav-btn active" data-page="home"><span class="icon">⌂</span><span>首頁</span></button><button class="nav-btn" data-page="records"><span class="icon">▤</span><span>成績紀錄</span></button><button class="nav-btn" data-page="subjects"><span class="icon">▥</span><span>分科表現</span></button></nav></div>
<script src="/parent/subject-insights.js?v=1"></script>
<script>
(() => {
const API='https://sphrceazgfrjtgeeikfp.supabase.co/functions/v1/parent-query-api',SESSION_KEY='class-grade-system-parent-session',HISTORY_BATCH_DAYS=7,DEFAULT_SUBJECT_ORDER=['國文','英文','數學','地理','歷史','公民','物理','化學','地科','生物'];
const pathParts=location.pathname.split('/').filter(Boolean),queryCode=String(pathParts[0]==='p'?pathParts[1]:'').trim().toLowerCase();let sessionData=null,selectedDate='',historyVisibleDays=HISTORY_BATCH_DAYS,selectedSubject='',subjectRecentLimit=5;
const loginView=document.getElementById('loginView'),appView=document.getElementById('appView'),form=document.getElementById('loginForm'),account=document.getElementById('account'),last4=document.getElementById('last4'),btn=document.getElementById('loginBtn'),status=document.getElementById('status');
function setStatus(message,type=''){status.textContent=message||'';status.className=`status${type?' '+type:''}`}function text(v){return String(v??'').trim()}function round2(n){return Number.isFinite(Number(n))?Number(n).toFixed(2):'—'}function mean(records){const a=records.map(r=>Number(r.score)).filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}function dateValue(s){const m=text(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12):null}function dateLabel(s){const d=dateValue(s);if(!d)return s;return`${d.getMonth()+1}/${d.getDate()}(${['日','一','二','三','四','五','六'][d.getDay()]})`}function inLast7CalendarDays(s){const d=dateValue(s);if(!d)return false;const t=new Date();t.setHours(12,0,0,0);const st=new Date(t);st.setDate(st.getDate()-6);return d>=st&&d<=t}function comparisonText(v){return v==='above'?'高於班平均':v==='below'?'低於班平均':'等於班平均'}function comparisonClass(v){return v==='above'?'above':v==='below'?'below':'equal'}function escapeHtml(v){return text(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function saveSession(data){try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({queryCode,data,savedAt:Date.now()}))}catch(_){}}function restoreSession(){try{const raw=sessionStorage.getItem(SESSION_KEY);if(!raw)return null;const saved=JSON.parse(raw);return saved?.queryCode===queryCode&&saved?.data?.ok?saved.data:null}catch(_){return null}}
function renderStudent(data){const s=data.student||{},c=data.class||{},term=c.term?`第${c.term}學期`:'',meta=[c.name,c.schoolYear?`${c.schoolYear}學年度`:'',term].filter(Boolean).join('｜');document.getElementById('headerClass').textContent=meta;const initial=text(s.name).slice(0,1)||'學';document.getElementById('studentCard').innerHTML=`<div class="student-avatar">${escapeHtml(initial)}</div><div><div class="student-name">${escapeHtml(s.name||'學生')}</div><div class="student-meta">${escapeHtml(meta)}<br>座號 ${escapeHtml(s.seat||'—')}｜學號 ${escapeHtml(s.account||'—')}</div></div>`}
function recentDates(records){const seen=new Set(),dates=[];for(const r of records){const d=text(r.date);if(!d||seen.has(d)||!inLast7CalendarDays(d))continue;seen.add(d);dates.push(d)}return dates.sort((a,b)=>b.localeCompare(a))}function renderDates(records){const dates=recentDates(records),tabs=document.getElementById('dateTabs');if(!dates.length){tabs.innerHTML='';selectedDate='';return dates}if(!dates.includes(selectedDate))selectedDate=dates[0];tabs.innerHTML=dates.map(d=>`<button type="button" class="date-tab${d===selectedDate?' active':''}" data-date="${escapeHtml(d)}">${escapeHtml(dateLabel(d))}</button>`).join('');tabs.querySelectorAll('.date-tab').forEach(el=>el.addEventListener('click',()=>{selectedDate=el.dataset.date||'';renderDates(records);renderGrades(records)}));return dates}
function bindScrollCounter(track,current,count,selector,gap=12){if(!track||!current||count<=1)return;let raf=0;track.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const first=track.querySelector(selector);if(!first)return;const step=first.getBoundingClientRect().width+gap,idx=Math.max(0,Math.min(count-1,Math.round(track.scrollLeft/step)));current.textContent=String(idx+1)})},{passive:true})}
function renderGrades(records){const area=document.getElementById('gradeArea');if(!selectedDate){area.innerHTML='<div class="empty-card">沒有成績</div>';return}const list=records.filter(r=>text(r.date)===selectedDate);if(!list.length){area.innerHTML='<div class="empty-card">沒有成績</div>';return}area.innerHTML=`<div class="grade-counter"><span id="gradeCurrent">1</span> / ${list.length}</div><div id="gradeTrack" class="grade-track">${list.map(r=>`<article class="grade-card"><div class="grade-heading">${escapeHtml(r.subject)}｜${escapeHtml(r.examName)}</div><div class="grade-score">${escapeHtml(r.score)}<small>分</small></div><div class="grade-info">班平均 ${round2(r.classAverage)}｜第 ${r.rank??'—'} 名／${r.participantCount??0} 人</div><div class="grade-comparison ${comparisonClass(r.comparison)}">${comparisonText(r.comparison)}</div></article>`).join('')}</div>${list.length>1?'<div class="swipe-note">左右滑動查看當日其他成績</div>':''}`;bindScrollCounter(document.getElementById('gradeTrack'),document.getElementById('gradeCurrent'),list.length,'.grade-card')}
function renderHome(data){renderStudent(data);const records=Array.isArray(data.records)?data.records:[];renderDates(records);renderGrades(records)}
function allHistoryDates(records){const seen=new Set(),dates=[];for(const r of records){const d=text(r.date);if(!d||seen.has(d))continue;seen.add(d);dates.push(d)}return dates.sort((a,b)=>b.localeCompare(a))}function renderRecords(){const records=Array.isArray(sessionData?.records)?sessionData.records:[],dates=allHistoryDates(records),listEl=document.getElementById('recordsList'),moreEl=document.getElementById('recordsMore');if(!dates.length){listEl.innerHTML='<div class="empty-card">沒有成績</div>';moreEl.innerHTML='';return}const visible=dates.slice(0,historyVisibleDays);listEl.innerHTML=visible.map(d=>{const rows=records.filter(r=>text(r.date)===d);return`<section class="record-day"><div class="record-date">${escapeHtml(dateLabel(d))}</div>${rows.map(r=>`<div class="record-row"><div class="record-main">${escapeHtml(r.subject)}｜${escapeHtml(r.examName)}</div><div class="record-values"><div class="record-score">${escapeHtml(r.score)} 分</div><div class="record-average">班平均 ${round2(r.classAverage)}</div></div></div>`).join('')}</section>`}).join('');if(historyVisibleDays<dates.length){moreEl.innerHTML='<button id="loadMoreRecords" class="load-more" type="button">載入更早成績</button>';document.getElementById('loadMoreRecords').addEventListener('click',()=>{historyVisibleDays+=HISTORY_BATCH_DAYS;renderRecords()})}else moreEl.innerHTML='<div class="records-end">已顯示本學期全部成績</div>'}
function subjectList(){const records=Array.isArray(sessionData?.records)?sessionData.records:[],actual=[];for(const r of records){const s=text(r.subject);if(s&&!actual.includes(s))actual.push(s)}const configured=Array.isArray(sessionData?.subjectOrder)?sessionData.subjectOrder.map(text).filter(Boolean):[],ordered=[];for(const s of configured)if(actual.includes(s)&&!ordered.includes(s))ordered.push(s);for(const s of DEFAULT_SUBJECT_ORDER)if(actual.includes(s)&&!ordered.includes(s))ordered.push(s);for(const s of actual)if(!ordered.includes(s))ordered.push(s);return ordered}
function renderSubjects(){const root=document.getElementById('subjectContent'),subjects=subjectList(),records=Array.isArray(sessionData?.records)?sessionData.records:[];if(!subjects.length){root.innerHTML='<div class="empty-card">沒有成績</div>';return}if(!subjects.includes(selectedSubject))selectedSubject=subjects[0];const all=records.filter(r=>text(r.subject)===selectedSubject),recent=all.slice(0,subjectRecentLimit),actualCount=recent.length;root.innerHTML=`<div class="subject-controls"><label>科目<select id="subjectSelect" class="subject-select">${subjects.map(s=>`<option value="${escapeHtml(s)}" ${s===selectedSubject?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></label><div><div class="recent-choice-label">近期範圍</div><div class="recent-choice">${[5,10,15].map(n=>`<button type="button" data-subject-limit="${n}" class="${n===subjectRecentLimit?'active':''}">近 ${n} 次</button>`).join('')}</div></div></div><div class="subject-summary"><div class="summary-card"><div class="summary-label">近 ${actualCount} 次平均</div><div class="summary-value">${round2(mean(recent))}</div></div><div class="summary-card"><div class="summary-label">本學期平均</div><div class="summary-value">${round2(mean(all))}</div></div></div><div class="subject-section-label">近期成績</div><div class="subject-counter"><span id="subjectCurrent">1</span> / ${recent.length}</div><div id="subjectTrack" class="subject-track">${recent.map(r=>`<article class="subject-card"><div class="subject-card-date">${escapeHtml(dateLabel(r.date))}</div><div class="subject-card-name">${escapeHtml(r.examName)}</div><div class="subject-card-score">${escapeHtml(r.score)}<small>分</small></div><div class="subject-card-detail">班平均 ${round2(r.classAverage)}<br>第 ${r.rank??'—'} 名／${r.participantCount??0} 人</div><div class="grade-comparison ${comparisonClass(r.comparison)}">${comparisonText(r.comparison)}</div></article>`).join('')}</div>${recent.length>1?'<div class="swipe-note">左右滑動查看其他成績</div>':''}`;document.getElementById('subjectSelect').addEventListener('change',e=>{selectedSubject=e.target.value;renderSubjects()});root.querySelectorAll('[data-subject-limit]').forEach(b=>b.addEventListener('click',()=>{subjectRecentLimit=Number(b.dataset.subjectLimit)||5;renderSubjects()}));bindScrollCounter(document.getElementById('subjectTrack'),document.getElementById('subjectCurrent'),recent.length,'.subject-card')}
function openPage(page){['home','records','subjects'].forEach(name=>document.getElementById(`${name}Page`)?.classList.toggle('hidden',name!==page));document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='records')renderRecords();if(page==='subjects')renderSubjects();window.scrollTo({top:0,behavior:'smooth'})}
function showApp(data){sessionData=data;saveSession(data);historyVisibleDays=HISTORY_BATCH_DAYS;selectedSubject='';subjectRecentLimit=5;loginView.classList.add('hidden');appView.classList.remove('hidden');renderHome(data);openPage('home')}
document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));document.getElementById('logoutBtn').addEventListener('click',()=>{try{sessionStorage.removeItem(SESSION_KEY)}catch(_){}sessionData=null;selectedDate='';historyVisibleDays=HISTORY_BATCH_DAYS;selectedSubject='';subjectRecentLimit=5;appView.classList.add('hidden');loginView.classList.remove('hidden');form.reset();setStatus('')});
if(!/^[a-z0-9-]{4,32}$/.test(queryCode)){btn.disabled=true;setStatus('查詢網址無效，請向老師確認正確網址。','error');return}const restored=restoreSession();if(restored)showApp(restored);
form.addEventListener('submit',async event=>{event.preventDefault();const studentAccount=account.value.trim(),pass=last4.value.trim();if(!studentAccount||!/^\d{4}$/.test(pass)){setStatus('請輸入學號與完整的身分證後4碼。','error');return}btn.disabled=true;btn.textContent='查詢中……';setStatus('正在確認學生資料……');try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({queryCode,studentAccount,last4:pass})});let data={};try{data=await res.json()}catch(_){}if(!res.ok||!data?.ok){if(res.status===503)throw new Error('查詢服務暫時無法使用，請稍後再試。');throw new Error(data?.message||'查無符合的學生資料，請確認學號與身分證後4碼是否正確。')}setStatus('登入成功。','success');showApp(data)}catch(err){setStatus(err?.message||'查詢失敗，請稍後再試。','error')}finally{btn.disabled=false;btn.textContent='登入查詢'}})
})();
</script>
