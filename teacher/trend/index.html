<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>學生趨勢分析</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#64748b;--primary:#2563eb;--soft:#eff6ff;--shadow:0 10px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}button,input,select{font:inherit}.wrap{max-width:1280px;margin:auto;padding:18px 14px 36px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.title{font-size:25px;font-weight:900;margin:0}.meta{color:var(--muted);font-size:14px;line-height:1.6;margin-top:5px}.close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;color:#475569;cursor:pointer}.panel,.chart-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:14px}.controls{display:grid;gap:14px}.subject-block label,.range-label{display:block;font-size:13px;font-weight:800;color:#475569;margin-bottom:6px}.select{width:100%;border:1px solid #d1d5db;border-radius:11px;background:#fff;padding:11px 12px;font-size:16px}.ranges{display:flex;gap:7px;flex-wrap:wrap}.range-btn{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;color:#475569;cursor:pointer}.range-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}.custom{display:none;align-items:center;gap:8px;margin-top:9px}.custom.show{display:flex}.custom input{width:92px;border:1px solid #d1d5db;border-radius:10px;padding:9px 10px}.apply{border:1px solid #93c5fd;background:var(--soft);color:#1d4ed8;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.state{margin-top:16px;min-height:420px;display:grid;place-items:center;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;color:#64748b;font-weight:800}.charts{display:none;grid-template-columns:1fr;gap:14px;margin-top:14px}.charts.show{display:grid}.chart-card{padding:14px;min-width:0}.chart-head{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:8px}.chart-title{font-size:18px;font-weight:900}.chart-sub{font-size:12px;color:var(--muted)}.chart{height:320px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%;display:block;touch-action:manipulation}.tip{position:fixed;z-index:1000;display:none;max-width:min(330px,calc(100vw - 24px));background:#111827;color:white;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.55;box-shadow:0 14px 36px rgba(15,23,42,.28);pointer-events:none}.tip.show{display:block}.tip b{font-size:14px}.axis-label{font-size:11px;fill:#64748b}.gridline{stroke:#e5e7eb;stroke-width:1}.zeroline{stroke:#94a3b8;stroke-width:1;stroke-dasharray:4 4}.trendline{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}.dot{fill:#fff;stroke:#2563eb;stroke-width:2.4;cursor:pointer}.hit{fill:transparent;cursor:pointer}.empty-chart{height:100%;display:grid;place-items:center;color:#64748b;font-weight:800}
@media(min-width:768px){.wrap{padding:24px 22px 44px}.controls{grid-template-columns:minmax(220px,320px) 1fr;align-items:end}.charts{grid-template-columns:1fr 1fr}.chart{height:400px}.state{min-height:400px}.title{font-size:28px}.chart-card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 class="title">學生趨勢分析</h1><div id="studentMeta" class="meta"></div></div>
    <button id="closeBtn" class="close" type="button">關閉分析</button>
  </div>
  <section class="panel">
    <div class="controls">
      <div class="subject-block"><label for="subjectSelect">科目</label><select id="subjectSelect" class="select"><option value="">請選擇科目</option></select></div>
      <div><div class="range-label">分析範圍</div><div class="ranges"><button class="range-btn" data-range="5">近5次</button><button class="range-btn active" data-range="10">近10次</button><button class="range-btn" data-range="15">近15次</button><button class="range-btn" data-range="custom">自訂</button><button class="range-btn" data-range="all">全部</button></div><div id="customRow" class="custom"><span>最近</span><input id="customN" type="number" min="1" step="1" inputmode="numeric" value="8"><span>次</span><button id="customApply" class="apply" type="button">套用</button></div></div>
    </div>
  </section>
  <div id="initialState" class="state">請先選擇科目</div>
  <section id="charts" class="charts">
    <article class="chart-card"><div class="chart-head"><div><div class="chart-title">Z 分數變化趨勢</div><div id="zSub" class="chart-sub"></div></div></div><div id="zChart" class="chart"></div></article>
    <article class="chart-card"><div class="chart-head"><div><div class="chart-title">班級百分位變化趨勢</div><div id="pSub" class="chart-sub"></div></div></div><div id="pChart" class="chart"></div></article>
  </section>
</div>
<div id="tooltip" class="tip"></div>
<script>
(() => {
const SESSION_KEY='class-grade-system-student-trend';
const text=v=>String(v??'').trim();
const valid=v=>{if(v===null||v===undefined||text(v)==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const esc=v=>text(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let payload=null,selectedSubject='',rangeMode='10',customN=8,lastPoints=[];
try{const raw=sessionStorage.getItem(SESSION_KEY);if(raw){payload=JSON.parse(raw)?.data||null;sessionStorage.removeItem(SESSION_KEY)}}catch(_){}
const meta=document.getElementById('studentMeta'),select=document.getElementById('subjectSelect'),state=document.getElementById('initialState'),charts=document.getElementById('charts'),tip=document.getElementById('tooltip');
if(!payload){state.textContent='找不到分析資料，請從教師端「學生與帳號管理」重新開啟。';return}
const c=payload.class||{},s=payload.student||{};meta.textContent=[`${text(s.seat)||'—'}號 ${text(s.name)||'學生'}`,text(c.name),text(c.year)?`${text(c.year)}學年度`:'',text(c.term)?`第${text(c.term)}學期`:''].filter(Boolean).join('｜');
function ownScore(exam){const hit=(exam.scores||[]).find(r=>text(r.seat)===text(s.seat));return hit?valid(hit.value):null}
const subjects=[...new Set((payload.exams||[]).filter(e=>ownScore(e)!==null).map(e=>text(e.subject)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
subjects.forEach(subject=>{const o=document.createElement('option');o.value=subject;o.textContent=subject;select.appendChild(o)});
function dateMs(v){const m=text(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?new Date(+m[1],+m[2]-1,+m[3],12,0,0,0).getTime():NaN}
function dateLabel(v){const m=text(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?`${+m[2]}/${+m[3]}`:text(v)}
function fullDate(v){const m=text(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?`${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')}`:text(v)}
function analyzeExam(exam){
  const own=ownScore(exam);if(own===null)return null;
  const scores=(exam.scores||[]).map(r=>valid(r.value)).filter(v=>v!==null),n=scores.length;
  if(!n)return null;
  const mean=scores.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(scores.reduce((sum,v)=>sum+(v-mean)*(v-mean),0)/n);
  const z=(own-mean)/sd;
  const lower=scores.filter(v=>v<own).length,equal=scores.filter(v=>v===own).length,greater=scores.filter(v=>v>own).length;
  const percentile=(lower+0.5*equal)/n*100;
  return{date:text(exam.date),subject:text(exam.subject),examName:text(exam.name),score:own,classAverage:mean,z,percentile,rank:1+greater,participantCount:n,sourceIndex:Number(exam.sourceIndex)||0};
}
function allSubjectPoints(){return(payload.exams||[]).filter(e=>text(e.subject)===selectedSubject).map(analyzeExam).filter(Boolean).sort((a,b)=>{const d=dateMs(a.date)-dateMs(b.date);return d||a.sourceIndex-b.sourceIndex})}
function limited(points){if(rangeMode==='all')return points;if(rangeMode==='custom')return points.slice(-Math.max(1,customN));return points.slice(-Number(rangeMode||10))}
function jitter(points){const groups=new Map();points.forEach(p=>{if(!groups.has(p.date))groups.set(p.date,[]);groups.get(p.date).push(p)});groups.forEach(group=>{const k=group.length;const step=1.5*60*60*1000;group.forEach((p,i)=>{p.xTime=dateMs(p.date)+(i-(k-1)/2)*step})});return points}
function fmt(n,d=2){return Number.isFinite(n)?Number(n).toFixed(d):'—'}
function showTip(p,e){tip.innerHTML=`<b>${esc(fullDate(p.date))}｜${esc(p.subject)}</b><br>${esc(p.examName||'—')}<br>原始分數：${esc(p.score)}<br>班平均：${fmt(p.classAverage)}<br>Z 分數：${p.z>=0?'+':''}${fmt(p.z)}<br>班級百分位：${fmt(p.percentile)}<br>名次：${p.rank} / ${p.participantCount}`;tip.classList.add('show');const pad=10,w=tip.offsetWidth,h=tip.offsetHeight;let x=(e?.clientX??innerWidth/2)+12,y=(e?.clientY??80)+12;if(x+w>innerWidth-pad)x=innerWidth-w-pad;if(y+h>innerHeight-pad)y=(e?.clientY??80)-h-12;if(y<pad)y=pad;tip.style.left=`${x}px`;tip.style.top=`${y}px`}
function hideTip(){tip.classList.remove('show')}
function svgEl(tag,attrs={}){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
function drawChart(host,points,key,fixedPercent=false){host.innerHTML='';if(!points.length){host.innerHTML='<div class="empty-chart">沒有可顯示的成績</div>';return}const W=Math.max(320,host.clientWidth||320),H=Math.max(280,host.clientHeight||320),m={l:46,r:16,t:14,b:42},iw=W-m.l-m.r,ih=H-m.t-m.b;const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});host.appendChild(svg);
  let minX=Math.min(...points.map(p=>p.xTime)),maxX=Math.max(...points.map(p=>p.xTime));if(minX===maxX){minX-=12*3600000;maxX+=12*3600000}
  const vals=points.map(p=>p[key]);let minY,maxY;if(fixedPercent){minY=0;maxY=100}else{minY=Math.min(0,...vals);maxY=Math.max(0,...vals);const pad=Math.max(.25,(maxY-minY)*.12);minY-=pad;maxY+=pad;if(minY===maxY){minY-=1;maxY+=1}}
  const sx=x=>m.l+(x-minX)/(maxX-minX)*iw,sy=y=>m.t+(maxY-y)/(maxY-minY)*ih;
  for(let i=0;i<=4;i++){const yVal=minY+(maxY-minY)*i/4,y=sy(yVal);svg.appendChild(svgEl('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,class:'gridline'}));const t=svgEl('text',{x:m.l-7,y:y+4,'text-anchor':'end',class:'axis-label'});t.textContent=fixedPercent?Math.round(yVal):yVal.toFixed(1);svg.appendChild(t)}
  if(!fixedPercent&&minY<0&&maxY>0){const y=sy(0);svg.appendChild(svgEl('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,class:'zeroline'}))}
  const unique=[...new Map(points.map(p=>[p.date,p])).values()];const maxLabels=innerWidth<768?5:7,step=Math.max(1,Math.ceil(unique.length/maxLabels));let ticks=unique.filter((_,i)=>i%step===0);if(unique.length&&ticks[ticks.length-1]!==unique[unique.length-1])ticks.push(unique[unique.length-1]);ticks.forEach(p=>{const x=sx(dateMs(p.date));const t=svgEl('text',{x,y:H-13,'text-anchor':'middle',class:'axis-label'});t.textContent=dateLabel(p.date);svg.appendChild(t)});
  const poly=svgEl('polyline',{points:points.map(p=>`${sx(p.xTime)},${sy(p[key])}`).join(' '),class:'trendline'});svg.appendChild(poly);
  points.forEach(p=>{const x=sx(p.xTime),y=sy(p[key]);const dot=svgEl('circle',{cx:x,cy:y,r:4.5,class:'dot'}),hit=svgEl('circle',{cx:x,cy:y,r:14,class:'hit'});const handler=e=>showTip(p,e);hit.addEventListener('mouseenter',handler);hit.addEventListener('mousemove',handler);hit.addEventListener('mouseleave',()=>{if(!matchMedia('(pointer:coarse)').matches)hideTip()});hit.addEventListener('click',e=>{e.preventDefault();handler(e)});svg.appendChild(dot);svg.appendChild(hit)});
}
function render(){if(!selectedSubject){charts.classList.remove('show');state.style.display='grid';state.textContent='請先選擇科目';hideTip();return}const pts=jitter(limited(allSubjectPoints()));lastPoints=pts;state.style.display='none';charts.classList.add('show');const rangeText=rangeMode==='all'?'全部':`最近 ${pts.length} 次`;document.getElementById('zSub').textContent=`${selectedSubject}｜${rangeText}`;document.getElementById('pSub').textContent=`${selectedSubject}｜${rangeText}`;drawChart(document.getElementById('zChart'),pts,'z',false);drawChart(document.getElementById('pChart'),pts,'percentile',true)}
select.addEventListener('change',()=>{selectedSubject=select.value;render()});
document.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>{rangeMode=b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('customRow').classList.toggle('show',rangeMode==='custom');if(rangeMode!=='custom')render()}));
document.getElementById('customApply').addEventListener('click',()=>{customN=Math.max(1,Math.floor(Number(document.getElementById('customN').value)||1));document.getElementById('customN').value=customN;render()});
document.getElementById('closeBtn').addEventListener('click',()=>window.close());
document.addEventListener('click',e=>{if(!e.target.closest('.hit')&&!e.target.closest('.tip'))hideTip()});
let resizeTimer=0;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(selectedSubject)render()},120)});
})();
</script>
</body>
</html>
