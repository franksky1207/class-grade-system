name: Fix share title

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update static title and share metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>班級成績管理系統｜測試版</title>', '<title>班級成績管理系統</title>')
          marker = '<meta name="viewport" content="width=device-width, initial-scale=1"/>'
          meta = '''<meta name="description" content="教師用班級成績管理、Excel 成績匯入與 Google 雲端同步系統"/>\n<meta property="og:title" content="班級成績管理系統"/>\n<meta property="og:description" content="教師用班級成績管理、Excel 成績匯入與 Google 雲端同步系統"/>\n<meta property="og:type" content="website"/>\n<meta property="og:url" content="https://class-grade-system.vercel.app/"/>'''
          if 'property="og:title"' not in s:
              s = s.replace(marker, marker + '\n' + meta)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use production title in shared link preview"
          git push
